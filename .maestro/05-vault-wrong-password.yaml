appId: app.clipbox
name: Wrong master password is rejected (run after 04 without clearing state)
tags:
  - security
  - manual
---
- launchApp
- tapOn: "Settings"
- tapOn: "Vault и приватные данные"
- tapOn: "Vault"
- tapOn: "Мастер-пароль"
- inputText: "definitely wrong password"
- tapOn: "Открыть"
- assertVisible: "Неверный пароль или ключ"
